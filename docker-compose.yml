version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: edaflow-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENV=production
      - APP_NAME=EDAflow
      - APP_VERSION=1.0.0
      - MAX_UPLOAD_SIZE_MB=100
      - STORAGE_RETENTION_HOURS=24
      - ALLOWED_ORIGINS=["http://localhost:3000","http://localhost:80","http://localhost:5173"]
    volumes:
      - backend_storage:/app/storage
      - backend_sample_data:/app/sample_data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - edaflow-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: edaflow-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - edaflow-net

volumes:
  backend_storage:
  backend_sample_data:

networks:
  edaflow-net:
    driver: bridge
